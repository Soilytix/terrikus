name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# One gate. `mise run check` is the definition of done (lint, format, types,
# unit tests, build, bundle scan, size budget); prek runs only the hooks that
# check does not, so nothing runs twice. The e2e job runs only on demand.
# Deploy lives in publish.yml.
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Installs the exact toolchain from mise.toml/mise.lock — same as local.
      - uses: jdx/mise-action@v2
        with:
          cache: true

      - run: pnpm install --frozen-lockfile

      # Hook-only checks (file hygiene, staged gitleaks); the skipped ones are in `mise run check`.
      - run: prek run --all-files --show-diff-on-failure
        env:
          SKIP: prettier,eslint,typecheck

      - run: mise run check

      # The public profile must build only approved content. Until a reviewer
      # approves a chapter it is expected to fail, so it is visible, not blocking.
      - run: SW_PROFILE=public pnpm exec vitest run tests/profile.test.ts
        continue-on-error: true

      # Backstop to the commit hook, over the whole checked-out tree.
      - run: gitleaks dir . --redact --verbose

  # Playwright smoke, axe on title/scene/notebook and the keyboard-only p-m1 run.
  # Non-blocking; screenshots are uploaded, never committed from CI. Manual
  # only (Actions → CI → Run workflow): it takes ~45 min of runner time.
  e2e:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: jdx/mise-action@v2
        with:
          cache: true

      - run: pnpm install --frozen-lockfile

      - run: pnpm exec playwright install --with-deps chromium

      - run: mise run e2e

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screens
          path: docs/screens/
