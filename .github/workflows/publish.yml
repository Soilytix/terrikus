name: Publish

on:
  push:
    branches: [main]
  workflow_dispatch:

# Every merge to main goes live behind IAP at hub.<base_domain>/artifacts/soil-worlds/
# (spec OD-4, taken by the loop). The internal profile ships, review badges and all;
# the public profile and host wait on OD-5. Keyless: GitHub OIDC through Workload
# Identity Federation, as a service account that can write artifacts/soil-worlds/ in
# the hub bucket and nothing else (core/static's publisher.tf in Soilytix/terraform).
permissions:
  contents: read
  id-token: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          cache: true

      - run: pnpm install --frozen-lockfile

      # Relative base and hash routing (D-5), so dist/ works under any prefix.
      - run: pnpm build

      # Both values are the `soil_worlds_publisher` output of core/static.
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: [gcp-project]
          workload_identity_provider: projects/[project-number]/locations/global/workloadIdentityPools/artifacts-publish/providers/soil-worlds
          service_account: [service-account]

      # The prefix-only grant denies storage.objects.list, which even `gcloud storage cp`
      # needs, so upload object by object and leave stale hashed chunks behind until
      # pruning is granted.
      - uses: google-github-actions/upload-cloud-storage@6397bd7208e18d13ba2619ee21b9873edc94427a # v3.0.0
        with:
          path: dist
          destination: [hub-bucket]/artifacts/soil-worlds
          parent: false
          process_gcloudignore: false
          # The hub proxy serves the stored bytes without Content-Encoding, so store them plain.
          gzip: false
